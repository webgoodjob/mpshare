<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TRACK - 定位與單次分享追蹤</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'PingFang TC', sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            color: #e6edf3;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #090d13;
        }
        /* CSS 科技暗色濾鏡 - 解決瓦片圖片問題 */
        .dark-tiles {
            filter: brightness(0.7) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3);
        }
        
        /* 頂部 HUD 狀態欄 */
        .hud-header {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 242, 254, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }
        .hud-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
        }

        /* 底部控制面板 */
        .controls-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 450px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .btn-share {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .btn-share:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* 彈窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: #161b22;
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-desc {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .url-box {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #4895ef;
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 16px;
            user-select: all;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-copy { background: #238636; color: #fff; }
        .btn-close { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

        /* 全螢幕鎖定畫面 (針對二次開啟者) */
        #lock-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }
        .lock-icon {
            font-size: 64px;
            color: #da3633;
            margin-bottom: 20px;
        }
        .lock-title {
            font-size: 22px;
            font-weight: bold;
            color: #f85149;
            margin-bottom: 10px;
        }
        .lock-desc {
            font-size: 14px;
            color: #8b949e;
            max-width: 400px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- 頂部 HUD -->
    <div class="hud-header">
        <div class="status-dot"></div>
        <div>
            <div class="hud-title">CYBER TRACK</div>
            <div style="font-size: 11px; color: #8b949e;" id="status-text">初始化定位系統...</div>
        </div>
        <span class="badge" id="mode-badge">即時模式</span>
    </div>

    <!-- 地圖主容器 -->
    <div id="map"></div>

    <!-- 底部控制按鈕 -->
    <div class="controls-panel" id="controls">
        <button class="btn-share" id="btn-share-trigger">
            <i class="fa-solid fa-share-nodes"></i>
            建立單次分享追蹤連結
        </button>
    </div>

    <!-- 複製彈窗 Modal -->
    <div class="modal-overlay" id="share-modal">
        <div class="modal-card">
            <div class="modal-title">
                <i class="fa-solid fa-lock"></i> 單次分享連結已建立
            </div>
            <div class="modal-desc">
                請複製下方專屬連結發送給對方。<b>【注意】此連結僅供開啟一次</b>，第一個打開的人可以看到您的位置，之後重新整理或其他人再打開皆會顯示失效鎖定。
            </div>
            <textarea class="url-box" id="share-url-input" rows="3" readonly></textarea>
            <div class="modal-actions">
                <button class="btn-modal btn-copy" id="btn-copy-action">
                    <i class="fa-solid fa-copy"></i> 複製連結
                </button>
                <button class="btn-modal btn-close" id="btn-close-action">關閉</button>
            </div>
        </div>
    </div>

    <!-- 二次點擊鎖定遮罩 -->
    <div id="lock-screen">
        <i class="fa-solid fa-shield-halved lock-icon"></i>
        <div class="lock-title">⛔ 連結已失效並鎖定</div>
        <div class="lock-desc">
            此為「單次安全分享連結」，該連結已被存取過一次。<br><br>
            基於安全隱私機制，同一連結無法再次讀取或重新整理檢視。
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDK (僅用於背景即時座標同步) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cyber-track-public-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let map, userMarker, accuracyCircle;
        let currentPos = { lat: 24.1477, lng: 120.6736 }; // 預設台中座標
        let currentShareId = null;

        // 1. 初始化地圖 (完全維持原樣)
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([currentPos.lat, currentPos.lng], 15);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                className: 'dark-tiles',
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // 自訂 Pulse 指標
            const pulseIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color:#00f2fe; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 12px #00f2fe;"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            userMarker = L.marker([currentPos.lat, currentPos.lng], { icon: pulseIcon }).addTo(map);
            accuracyCircle = L.circle([currentPos.lat, currentPos.lng], { radius: 100, color: '#00f2fe', fillColor: '#00f2fe', fillOpacity: 0.15 }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 200);
        }

        // 2. 檢查 URL 網址是否為「被分享者檢視」（改為加入 Firebase 即時監聽）
        function checkUrlHash() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#track=')) {
                try {
                    const encodedData = hash.replace('#track=', '');
                    const decodedStr = atob(encodedData);
                    const data = JSON.parse(decodedStr);

                    // 檢查這個 Token 是否已經在該瀏覽器開啟過（完全保留原版 localStorage 機制）
                    const usedToken = localStorage.getItem('used_token_' + data.id);
                    if (usedToken) {
                        // 已經開過了 -> 顯示全螢幕鎖定畫面
                        document.getElementById('lock-screen').style.display = 'flex';
                        return true;
                    } else {
                        // 第一次點開 -> 註記已開啟並解密顯示
                        localStorage.setItem('used_token_' + data.id, 'true');
                        
                        document.getElementById('status-text').innerText = '即時同步連線中...';
                        document.getElementById('mode-badge').innerText = '單次存取者視角';
                        document.getElementById('controls').style.display = 'none'; // 隱藏分享按鈕

                        // 初始設置為傳遞過來的座標
                        currentPos = { lat: data.lat, lng: data.lng };
                        map.setView([data.lat, data.lng], 16);
                        userMarker.setLatLng([data.lat, data.lng]);
                        accuracyCircle.setLatLng([data.lat, data.lng]);

                        // 【新增即時功能】：從雲端監聽最新即時座標
                        db.ref('sessions/' + data.id).on('value', (snap) => {
                            const liveData = snap.val();
                            if (liveData && liveData.lat && liveData.lng) {
                                const timeStr = new Date(liveData.timestamp).toLocaleTimeString();
                                document.getElementById('status-text').innerText = `即時追蹤中 (${timeStr})`;
                                
                                map.panTo([liveData.lat, liveData.lng], { animate: true, duration: 0.8 });
                                userMarker.setLatLng([liveData.lat, liveData.lng]);
                                accuracyCircle.setLatLng([liveData.lat, liveData.lng]);
                                if (liveData.accuracy) accuracyCircle.setRadius(liveData.accuracy);
                            }
                        });

                        return true;
                    }
                } catch (e) {
                    console.error('無效的分享連結', e);
                }
            }
            return false;
        }

        // 3. 定位追蹤 (GPS) - 改為高頻動態監聽並即時推送至雲端
        function startGeolocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        currentPos.lat = position.coords.latitude;
                        currentPos.lng = position.coords.longitude;

                        document.getElementById('status-text').innerText = `高精度 GPS 定位中 (${position.coords.accuracy.toFixed(0)}m)`;
                        
                        map.setView([currentPos.lat, currentPos.lng], 16);
                        userMarker.setLatLng([currentPos.lat, currentPos.lng]);
                        accuracyCircle.setLatLng([currentPos.lat, currentPos.lng]);
                        accuracyCircle.setRadius(position.coords.accuracy);

                        // 【新增即時功能】：如果已建立分享連結，將最新座標同步推送到雲端
                        if (currentShareId) {
                            db.ref('sessions/' + currentShareId).update({
                                lat: currentPos.lat,
                                lng: currentPos.lng,
                                accuracy: position.coords.accuracy,
                                timestamp: Date.now()
                            });
                        }
                    },
                    (error) => {
                        document.getElementById('status-text').innerText = '使用模擬展示定位 (請在 HTTPS 開啟 GPS)';
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                document.getElementById('status-text').innerText = '瀏覽器不支援 GPS 定位';
            }
        }

        // 4. 建立單次分享連結 (完全保留原版產出 payload 與 btoa 邏輯，不動長度)
        document.getElementById('btn-share-trigger').addEventListener('click', () => {
            const shareId = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            currentShareId = shareId; // 上記此 ID 以便進行即時廣播

            const payload = {
                id: shareId,
                lat: currentPos.lat,
                lng: currentPos.lng,
                time: new Date().getTime()
            };

            // 【新增即時功能】：同步初始化雲端節點
            db.ref('sessions/' + shareId).set({
                lat: currentPos.lat,
                lng: currentPos.lng,
                accuracy: 30,
                timestamp: Date.now()
            });

            // 完全維持您原本的 btoa 網址產生方式
            const encoded = btoa(JSON.stringify(payload));
            const baseUrl = window.location.href.split('#')[0];
            const fullShareUrl = `${baseUrl}#track=${encoded}`;

            // 寫入畫面 Input 並跳出 Modal
            const urlInput = document.getElementById('share-url-input');
            urlInput.value = fullShareUrl;
            document.getElementById('share-modal').style.display = 'flex';
        });

        // 5. 複製按鈕功能 (完全保留原版)
        document.getElementById('btn-copy-action').addEventListener('click', () => {
            const urlInput = document.getElementById('share-url-input');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999); // 針對手機瀏覽器

            try {
                navigator.clipboard.writeText(urlInput.value);
                alert('連結已成功複製到剪貼簿！');
            } catch (err) {
                document.execCommand('copy');
                alert('連結已成功複製！');
            }
        });

        // 關閉 Modal (完全保留原版)
        document.getElementById('btn-close-action').addEventListener('click', () => {
            document.getElementById('share-modal').style.display = 'none';
        });

        // 啟動流程 (完全保留原版)
        window.onload = () => {
            initMap();
            const isViewer = checkUrlHash();
            if (!isViewer) {
                startGeolocation();
            }
        };
    </script>
</body>
</html>
