<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TRACK - 極短網址單次即時追蹤</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'PingFang TC', sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            color: #e6edf3;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #090d13;
        }
        .dark-tiles {
            filter: brightness(0.7) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3);
        }

        /* 頂部 HUD 狀態欄 */
        .hud-header {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 242, 254, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }
        .hud-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
        }

        /* 底部控制面板 */
        .controls-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 450px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .btn-share {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 彈窗 Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 2000;
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: #161b22;
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-desc {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .url-box {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #4895ef;
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 16px;
            user-select: all;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-copy { background: #238636; color: #fff; }
        .btn-close { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

        /* 全螢幕鎖定遮罩 */
        #lock-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }
        .lock-icon { font-size: 64px; color: #da3633; margin-bottom: 20px; }
        .lock-title { font-size: 22px; font-weight: bold; color: #f85149; margin-bottom: 10px; }
        .lock-desc { font-size: 14px; color: #8b949e; max-width: 400px; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- 頂部 HUD -->
    <div class="hud-header">
        <div class="status-dot"></div>
        <div>
            <div class="hud-title">CYBER TRACK</div>
            <div style="font-size: 11px; color: #8b949e;" id="status-text">初始化定位系統...</div>
        </div>
        <span class="badge" id="mode-badge">主控端</span>
    </div>

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 底部控制區 -->
    <div class="controls-panel" id="controls">
        <button class="btn-share" id="btn-share-trigger">
            <i class="fa-solid fa-satellite-dish"></i>
            建立極短網址單次追蹤連結
        </button>
    </div>

    <!-- 複製連結 Modal -->
    <div class="modal-overlay" id="share-modal">
        <div class="modal-card">
            <div class="modal-title">
                <i class="fa-solid fa-link"></i> 單次追蹤連結已建立
            </div>
            <div class="modal-desc">
                極短網址已產生！請將下方連結傳給指定對象。<br>
                <span style="color:#f85149;">【單次限制】第一個人點開後，其他人或重新整理皆會永久失效！</span>
            </div>
            <textarea class="url-box" id="share-url-input" rows="2" readonly></textarea>
            <div class="modal-actions">
                <button class="btn-modal btn-copy" id="btn-copy-action">
                    <i class="fa-solid fa-copy"></i> 複製連結
                </button>
                <button class="btn-modal btn-close" id="btn-close-action">關閉</button>
            </div>
        </div>
    </div>

    <!-- 鎖定遮罩 -->
    <div id="lock-screen">
        <i class="fa-solid fa-shield-halved lock-icon"></i>
        <div class="lock-title">⛔ 該連結已被其他人開啟並失效</div>
        <div class="lock-desc">
            此追蹤連結設定為「全球唯一單次開啟」。<br><br>
            系統偵測到該連結已被率先讀取過，因此自動永久封鎖，無法再次檢視。
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://cyber-track-public-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let map, userMarker, accuracyCircle;
        let currentPos = { lat: 24.1477, lng: 120.6736 };
        let currentSessionId = null;
        let isBroadcasting = false;

        // 產生 4 位數極短 Key (字母 + 數字)
        function generateShortCode(length = 4) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([currentPos.lat, currentPos.lng], 16);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                className: 'dark-tiles',
                attribution: '© OpenStreetMap'
            }).addTo(map);

            const pulseIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color:#00f2fe; width:16px; height:16px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 14px #00f2fe;"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            userMarker = L.marker([currentPos.lat, currentPos.lng], { icon: pulseIcon }).addTo(map);
            accuracyCircle = L.circle([currentPos.lat, currentPos.lng], { radius: 50, color: '#00f2fe', fillColor: '#00f2fe', fillOpacity: 0.15 }).addTo(map);
        }

        function updateLocationOnMap(lat, lng, accuracy = 50, statusMsg = "") {
            currentPos = { lat, lng };
            userMarker.setLatLng([lat, lng]);
            accuracyCircle.setLatLng([lat, lng]);
            accuracyCircle.setRadius(accuracy);
            map.panTo([lat, lng], { animate: true, duration: 1.0 });

            if (statusMsg) {
                document.getElementById('status-text').innerText = statusMsg;
            }
        }

        // 檢查是否為檢視者 (極短碼解析)
        function checkViewerMode() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#track=')) {
                const sessionId = hash.replace('#track=', '');
                const openedRef = db.ref('sessions/' + sessionId + '/opened');
                const sessionRef = db.ref('sessions/' + sessionId);

                // Firebase 交易安全鎖定
                openedRef.transaction((currentVal) => {
                    if (currentVal === false || currentVal === null) {
                        return true; // 第一個點開的人搶到權限
                    } else {
                        return; // 已經被開過，中止交易
                    }
                }, (error, committed, snapshot) => {
                    if (committed) {
                        document.getElementById('controls').style.display = 'none';
                        document.getElementById('mode-badge').innerText = '實時追蹤者視角';
                        document.getElementById('status-text').innerText = '已成功連線，即時追蹤中...';

                        // 監聽發送者座標
                        sessionRef.on('value', (snap) => {
                            const data = snap.val();
                            if (data && data.lat && data.lng) {
                                const timeStr = new Date(data.timestamp).toLocaleTimeString();
                                updateLocationOnMap(data.lat, data.lng, data.accuracy || 30, `即時追蹤中 (最後更新 ${timeStr})`);
                            }
                        });
                    } else {
                        // 已經被開過 -> 顯示封鎖畫面
                        document.getElementById('lock-screen').style.display = 'flex';
                    }
                });

                return true;
            }
            return false;
        }

        function startHostGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const acc = position.coords.accuracy;

                        updateLocationOnMap(lat, lng, acc, `GPS 定位中 (精確度 ${acc.toFixed(0)}m)`);

                        if (isBroadcasting && currentSessionId) {
                            db.ref('sessions/' + currentSessionId).update({
                                lat: lat,
                                lng: lng,
                                accuracy: acc,
                                timestamp: Date.now()
                            });
                        }
                    },
                    (error) => {
                        document.getElementById('status-text').innerText = '請開啟 GPS 權限以取得精確即時位置';
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            }
        }

        // 點擊建立極短網址連結
        document.getElementById('btn-share-trigger').addEventListener('click', () => {
            currentSessionId = generateShortCode(4); // 產生 4 位數極短 Code (如: a7k2)
            isBroadcasting = true;

            db.ref('sessions/' + currentSessionId).set({
                lat: currentPos.lat,
                lng: currentPos.lng,
                accuracy: 30,
                timestamp: Date.now(),
                opened: false
            });

            const baseUrl = window.location.href.split('#')[0];
            const fullShareUrl = `${baseUrl}#track=${currentSessionId}`;

            const urlInput = document.getElementById('share-url-input');
            urlInput.value = fullShareUrl;
            document.getElementById('share-modal').style.display = 'flex';
        });

        document.getElementById('btn-copy-action').addEventListener('click', () => {
            const urlInput = document.getElementById('share-url-input');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);

            try {
                navigator.clipboard.writeText(urlInput.value);
                alert('極短追蹤連結已成功複製！');
            } catch (err) {
                document.execCommand('copy');
                alert('極短追蹤連結已成功複製！');
            }
        });

        document.getElementById('btn-close-action').addEventListener('click', () => {
            document.getElementById('share-modal').style.display = 'none';
        });

        window.onload = () => {
            initMap();
            const isViewer = checkViewerMode();
            if (!isViewer) {
                startHostGPS();
            }
        };
    </script>
</body>
</html>
